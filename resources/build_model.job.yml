# Job 1 : fabriquer une version (côté dev).
# Il n'écrit que dans le schéma dev : il n'a besoin d'aucun droit sur prd.
resources:
  jobs:
    build_model:
      name: build_model
      # Un seul run à la fois : deux runs simultanés déplaceraient "candidate" l'un sous l'autre.
      max_concurrent_runs: 1
      timeout_seconds: 3600

      # Paramètres modifiables à chaque run (--params). Visibles comme widgets dans les notebooks.
      parameters:
        - name: prompt_variant # "good" ou "weak" (démonstration du gate)
          default: good
        - name: system_prompt # vide = prompt système par défaut de la variante "good"
          default: ""
        - name: temperature
          default: "0.1"
        - name: max_tokens
          default: "200"

        - default: dev_training
          name: catalog
          # Aucun bloc de compute : les tâches tournent en serverless.
          # Secours sans serverless : décommenter et ajouter "job_cluster_key: small" sur chaque tâche.
          # job_clusters:
          #   - job_cluster_key: small
          #     new_cluster:
          #       spark_version: 16.4.x-cpu-ml-scala2.12
          #       node_type_id: ${var.node_type_id}
          #       num_workers: 0
          #       spark_conf: {spark.master: "local[*]"}
          #       custom_tags: {ResourceClass: SingleNode}
          #       data_security_mode: SINGLE_USER

      tasks:
        - task_key: setup_knowledge
          notebook_task:
            notebook_path: ../src/build/01_setup_knowledge.py
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              source_table: ${var.source_table}

        - task_key: train
          depends_on: [{task_key: setup_knowledge}]
          notebook_task:
            notebook_path: ../src/build/02_train.py
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              model_name: ${var.model_name}
              serving_endpoint: ${var.serving_endpoint}
              # ID résolu au déploiement depuis la ressource experiment du bundle.
              experiment_id: ${resources.experiments.llm_lifecycle_experiment.id}
