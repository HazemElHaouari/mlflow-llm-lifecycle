# Job 2 : évaluer, valider et promouvoir (côté workspace cible).
# En prod : déployé dans le workspace prd, exécuté par un service principal (run_as),
# déclenché par un ordonnanceur externe (ex. Control-M) via l'API Jobs run-now.
resources:
  jobs:
    promote_model:
      name: promote_model
      # Une seule promotion à la fois : évite deux déplacements concurrents de "champion".
      max_concurrent_runs: 1
      timeout_seconds: 3600

      parameters:
        # Version dev à promouvoir. C'est le seul lien entre les deux jobs.
        # Vide = la version qui porte l'alias "candidate" en dev.
        - name: model_version
          default: ""

      # Aucun bloc de compute : serverless (voir build_model.job.yml pour le secours).
      tasks:
        - task_key: setup_eval_set
          notebook_task:
            notebook_path: ../src/promote/01_setup_eval_set.ipynb
            base_parameters:
              catalog: ${var.catalog}
              prd_schema: ${var.prd_schema}
              source_table: ${var.source_table}
              eval_set_size: ${var.eval_set_size}

        - task_key: evaluate
          depends_on: [{task_key: setup_eval_set}]
          notebook_task:
            notebook_path: ../src/promote/02_evaluate.ipynb
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              prd_schema: ${var.prd_schema}
              model_name: ${var.model_name}
              experiment_id: ${resources.experiments.llm_lifecycle_experiment.id}
              judge_model: ${var.judge_model}
              max_answer_chars: ${var.max_answer_chars}

        - task_key: validate
          depends_on: [{task_key: evaluate}]
          notebook_task:
            notebook_path: ../src/promote/03_validate.ipynb
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              model_name: ${var.model_name}
              min_correctness: ${var.min_correctness}
              min_keyword_rate: ${var.min_keyword_rate}
              min_length_pass_rate: ${var.min_length_pass_rate}

        # Condition task : rend la bifurcation visible dans le graphe du job.
        - task_key: check_gate
          depends_on: [{task_key: validate}]
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.validate.values.decision}}"
            right: passed

        - task_key: promote
          depends_on: [{task_key: check_gate, outcome: "true"}]
          notebook_task:
            notebook_path: ../src/promote/04_promote.ipynb
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              prd_schema: ${var.prd_schema}
              model_name: ${var.model_name}
              # Références dynamiques résolues à l'exécution : traçabilité de la promotion.
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              trigger_type: "{{job.trigger.type}}"

        - task_key: skip_promotion
          depends_on: [{task_key: check_gate, outcome: "false"}]
          notebook_task:
            notebook_path: ../src/promote/05_skip_promotion.ipynb
            base_parameters:
              catalog: ${var.catalog}
              dev_schema: ${var.dev_schema}
              prd_schema: ${var.prd_schema}
              model_name: ${var.model_name}
